<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6B52"/>
      <stop offset="1" stop-color="#7CC7A6"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EAFBF2"/>
      <stop offset="0.45" stop-color="#7CC7A6"/>
      <stop offset="1" stop-color="#2F6B52"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D292D"/>
      <stop offset="1" stop-color="#081F22"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 圆角方形底（app 图标用；界面内可去掉此层） -->
  <g transform="translate(256 256)">
    <!-- 黑胶外缘 -->
    <circle r="196" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.35"/>
    <!-- 唱片纹路 = 同心涟漪，间隔递减，营造由外向内汇聚 -->
    <g fill="none" stroke="url(#ring)" stroke-linecap="round">
      <circle r="168" stroke-width="5" opacity="0.5" stroke-dasharray="1 12"/>
      <circle r="140" stroke-width="7" opacity="0.7"/>
      <circle r="112" stroke-width="5" opacity="0.45" stroke-dasharray="2 11"/>
      <circle r="84"  stroke-width="8" opacity="0.9"/>
      <circle r="56"  stroke-width="5" opacity="0.6" stroke-dasharray="1 9"/>
    </g>
    <!-- 中心涟漪点亮 -->
    <circle r="30" fill="url(#core)" filter="url(#glow)"/>
    <circle r="11" fill="#081F22"/>
    <circle r="5"  fill="url(#core)"/>
    <!-- 唱针弧线：一条从外缘扫向中心的弧，增加"播放"语义 -->
    <path d="M -150 -128 A 196 196 0 0 1 96 -168" fill="none"
          stroke="url(#ring)" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
